[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openseadragon-tiler"
version = "0.1.0"
description = "Tile large images into Deep Zoom (DZI) pyramids for OpenSeadragon."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyvips[binary]>=2.2.2",
]

# Installed command: `tile-image` -> src/tilers/openseadragon/cli.py:main
[project.scripts]
tile-image = "tilers.openseadragon.cli:main"

# src layout: packages are looked up inside src/ (tilers and tilers.openseadragon).
[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
