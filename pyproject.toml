[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openseadragon-tiler"
version = "0.1.0"
description = "Tile large images into Deep Zoom (DZI) pyramids for OpenSeadragon."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.13.5",
    "pyvips[binary]>=2.2.2",
]

# Installed command: `tile-image` -> src/tilers/openseadragon/cli.py:main
[project.scripts]
tile-image = "tilers.openseadragon.cli:main"

# src layout: packages are looked up inside src/ 
[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "pyvips.*"
ignore_missing_imports = true  # pyvips ships no type stubs
